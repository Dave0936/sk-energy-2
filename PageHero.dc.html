<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Hero" style="padding:0;margin:0">
  <div style="{{ boxStyle }}">
    <img data-hero-bg="" src="{{ img }}" alt="{{ alt }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 40%">
    <div style="position:absolute;inset:0;background:linear-gradient(67deg, rgb(0,0,0) -18%, rgba(0,0,0,0.66) 42%, rgba(0,0,0,0.08) 92%)"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 24%)"></div>
    <div style="position:relative;z-index:1;margin:0 clamp(20px,4.6vw,66px);padding:clamp(120px,16vh,150px) 0 clamp(110px,12vh,140px);max-width:760px;display:flex;flex-direction:column;gap:20px">
      <nav aria-label="Breadcrumb" data-hero-in="" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:rgba(255,255,255,0.72)">
        <a href="SK%20Energy%20Homepage.dc.html" style="color:rgba(255,255,255,0.72)" style-hover="color:#cbf24c">Home</a>
        <sc-if value="{{ hasParent }}"><span aria-hidden="true">/</span><a href="{{ parentHref }}" style="color:rgba(255,255,255,0.72)" style-hover="color:#cbf24c">{{ parentLabel }}</a></sc-if>
        <span aria-hidden="true">/</span><span aria-current="page" style="color:#fff">{{ crumb }}</span>
      </nav>
      <sc-if value="{{ eyebrow }}"><span data-hero-in="" style="align-self:flex-start;padding:5px 14px;border-radius:999px;background:#cbf24c;color:#0E1110;font-size:14px;font-weight:500">{{ eyebrow }}</span></sc-if>
      <h1 data-hero-in="" style="margin:0;font-weight:600;font-size:clamp(34px,5vw,72px);line-height:1.08;letter-spacing:-0.025em;color:#fff;text-wrap:balance">{{ title }}</h1>
      <sc-if value="{{ intro }}"><p data-hero-in="" style="margin:0;max-width:600px;font-size:clamp(16px,1.3vw,18px);line-height:1.55;color:rgba(255,255,255,0.86);text-wrap:pretty">{{ intro }}</p></sc-if>
      <sc-if value="{{ meta }}"><span data-hero-in="" style="font-size:14px;color:rgba(255,255,255,0.75)">{{ meta }}</span></sc-if>
      <sc-if value="{{ ctaLabel }}">
        <a data-hero-in="" href="{{ ctaHref }}" data-magnetic="" style="align-self:flex-start;height:56px;padding:0 10px 0 26px;border-radius:999px;background:#cbf24c;color:#0E1110;font-size:17px;font-weight:600;display:flex;align-items:center;gap:16px" style-hover="color:#0E1110;background:#d8f86f">{{ ctaLabel }} <span aria-hidden="true" style="width:38px;height:38px;border-radius:50%;background:#0E1110;color:#cbf24c;display:flex;align-items:center;justify-content:center">→</span></a>
      </sc-if>
    </div>
    <span aria-hidden="true" style="position:absolute;left:min(860px,94%);bottom:-1px;width:clamp(28px,3vw,40px);height:clamp(28px,3vw,40px);background:radial-gradient(circle at 100% 0, transparent 70%, #fff calc(70% + 1px));pointer-events:none"></span>
    <div style="position:absolute;left:0;bottom:-1px;width:min(860px,94%);height:67px;background:#fff;border-top-right-radius:clamp(28px,3vw,40px);display:flex;align-items:center;gap:10px;padding:14px 28px 0 clamp(20px,4.6vw,66px);overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;scrollbar-width:none">
      <sc-for list="{{ chipList }}" as="c" hint-placeholder-count="4">
        <a href="{{ c.href }}" aria-current="{{ c.current }}" style="{{ c.style }}" style-hover="border-color:#0E1110">{{ c.label }}</a>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:780},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intro&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;parentLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;parentHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Contact.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tall&quot;,&quot;short&quot;],&quot;default&quot;:&quot;tall&quot;,&quot;tsType&quot;:&quot;'tall'|'short'&quot;},&quot;activeChip&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;chips&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;{label:string,href:string,key?:string}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const services = [['Solar PV', 'solar-pv'], ['Battery Storage', 'battery-storage'], ['Heat Pumps', 'heat-pumps'], ['EV Chargers', 'ev-chargers'], ['Underfloor Heating', 'underfloor-heating']];
    const chips = Array.isArray(p.chips) && p.chips.length ? p.chips : services.map(([label, s]) => ({ label, href: 'Service.dc.html?slug=' + s, key: s }));
    const activeKey = p.activeChip || '';
    const short = p.size === 'short';
    return {
      img: p.img || '', alt: p.alt || '', title: p.title || '', intro: p.intro || '', eyebrow: p.eyebrow || '', meta: p.meta || '', crumb: p.crumb || '',
      hasParent: !!p.parentLabel, parentLabel: p.parentLabel || '', parentHref: p.parentHref || '#',
      ctaLabel: p.ctaLabel || '', ctaHref: p.ctaHref || 'Contact.dc.html',
      boxStyle: { position: 'relative', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', minHeight: short ? 'clamp(520px,64vh,620px)' : 'clamp(600px,82vh,780px)', borderRadius: '0 0 clamp(28px,3vw,40px) 0', overflow: 'hidden', background: '#0E1110' },
      chipList: chips.map((c, i) => {
        const on = c.key ? c.key === activeKey : i === 0 && !activeKey;
        return { ...c, current: on ? 'page' : 'false', style: on
          ? { padding: '6px 14px', borderRadius: 999, background: '#cbf24c', color: '#0E1110', fontSize: 14, fontWeight: 500, whiteSpace: 'nowrap', border: '1px solid #cbf24c' }
          : { padding: '5px 13px', borderRadius: 999, border: '1px solid #D3D5D0', color: '#0E1110', fontSize: 14, whiteSpace: 'nowrap' } };
      })
    };
  }
}
</script>
</body>
</html>
