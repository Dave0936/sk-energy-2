<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:clamp(24px,3vw,36px)">
  <div role="tablist" aria-label="Filter articles by category" style="display:flex;flex-wrap:wrap;gap:8px;padding:6px;border-radius:999px;background:#F1F1EF;align-self:flex-start;max-width:100%">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
      <button type="button" role="tab" id="{{ t.id }}" aria-selected="{{ t.selected }}" onClick="{{ t.select }}" style="{{ t.style }}">{{ t.label }} <span style="{{ t.countStyle }}">{{ t.count }}</span></button>
    </sc-for>
  </div>
  <div ref="{{ gridRef }}" role="tabpanel" aria-labelledby="{{ activeTabId }}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px">
    <sc-for list="{{ cards }}" as="a" hint-placeholder-count="0">
      <a href="{{ a.href }}" data-ncard="" data-hover-zoom="" style="{{ a.cardStyle }}" style-hover="color:#0E1110">
        <div style="{{ a.mediaStyle }}"><img data-zoom="" src="{{ a.img }}" alt="{{ a.alt }}" style="width:100%;height:100%;object-fit:cover;display:block"></div>
        <div style="display:flex;flex-direction:column;gap:12px;padding:clamp(20px,2vw,28px);flex:1 1 300px">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:#6C7566">
            <span style="padding:4px 12px;border-radius:999px;background:#cbf24c;color:#0E1110;font-weight:500">{{ a.cat }}</span>
            <span>{{ a.metaLine }}</span>
          </div>
          <h3 style="{{ a.titleStyle }}">{{ a.title }}</h3>
          <p style="margin:0;font-size:15px;line-height:1.55;color:#6C7566">{{ a.excerpt }}</p>
          <span style="margin-top:auto;padding-top:6px;font-size:15px;font-weight:600">Read the article →</span>
        </div>
      </a>
    </sc-for>
  </div>
  <sc-if value="{{ empty }}">
    <p style="margin:0;padding:32px;border-radius:32px;background:#F1F1EF;font-size:16px;color:#6C7566">No articles in this category yet.</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900},&quot;limit&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;featured&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { d: null, tab: 'All' };
  gridRef = React.createRef();
  componentDidMount() {
    import(new URL('site-data.js', location.href).href).then(d => this.setState({ d }));
  }
  componentDidUpdate() {
    const changed = this._tab !== undefined && this._tab !== this.state.tab;
    this._tab = this.state.tab;
    if (changed && this.gridRef.current) {
      import(new URL('site-motion.js', location.href).href).then(m => m.pop(this.gridRef.current.querySelectorAll('[data-ncard]')));
    }
  }
  renderVals() {
    const d = this.state.d, tab = this.state.tab;
    const limit = +this.props.limit || 0;
    const featured = !(this.props.featured === false || this.props.featured === 'false');
    const cats = d ? d.CATEGORIES : ['All', 'Guides', 'Funding', 'EV', 'New build', 'Company news'];
    const all = d ? d.ARTICLES : [];
    let list = tab === 'All' ? all : all.filter(a => a.cat === tab);
    if (limit) list = list.slice(0, limit);
    const ez = 'cubic-bezier(.22,1,.36,1)';
    return {
      gridRef: this.gridRef,
      activeTabId: 'ntab-' + cats.indexOf(tab),
      tabs: cats.map((c, i) => {
        const on = c === tab;
        const n = c === 'All' ? all.length : all.filter(a => a.cat === c).length;
        return { label: c, id: 'ntab-' + i, selected: on, count: d ? String(n) : '',
          select: () => this.setState({ tab: c }),
          style: { height: 44, padding: '0 16px 0 18px', borderRadius: 999, border: 0, cursor: 'pointer', fontFamily: 'inherit', fontSize: 15, fontWeight: on ? 600 : 500, display: 'flex', alignItems: 'center', gap: 8, background: on ? '#0E1110' : 'transparent', color: on ? '#fff' : '#0E1110', transition: 'background .35s ' + ez + ', color .35s' },
          countStyle: { minWidth: 22, height: 22, padding: '0 6px', borderRadius: 999, fontSize: 12, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', background: on ? '#cbf24c' : '#fff', color: '#0E1110' } };
      }),
      cards: list.map((a, i) => {
        const big = featured && i === 0 && list.length > 2;
        return { ...a, href: 'Article.dc.html?slug=' + a.slug, metaLine: a.date + ' · ' + a.mins + ' min read',
          cardStyle: { gridColumn: big ? '1 / -1' : 'auto', display: 'flex', flexDirection: big ? 'row' : 'column', flexWrap: 'wrap', borderRadius: 32, overflow: 'hidden', background: '#fff', border: '1px solid #E8E8E5', color: '#0E1110', minHeight: big ? 380 : 0 },
          mediaStyle: { flex: big ? '1.3 1 420px' : '0 0 auto', height: big ? 'auto' : 220, minHeight: big ? 300 : 0, overflow: 'hidden', background: '#E8E8E5' },
          titleStyle: { margin: 0, fontSize: big ? 'clamp(26px,2.4vw,34px)' : 20, fontWeight: big ? 600 : 700, lineHeight: 1.25, letterSpacing: '-0.01em', textWrap: 'balance' } };
      }),
      empty: !!d && list.length === 0
    };
  }
}
</script>
</body>
</html>
