<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>SK Energy — Our work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#0E1110;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#0E1110;text-decoration:none}
a:hover{color:#4d5c12}
:focus-visible{outline:2px solid #cbf24c;outline-offset:3px;border-radius:8px}
button{font-family:inherit}
::selection{background:#cbf24c;color:#0E1110}
</style>
</helmet>
<dc-import name="SiteHeader" active="work" hint-size="100%,1px"></dc-import>
<main id="main">
  <dc-import name="PageHero" title="1,400+ systems, homes to building sites." intro="Residential retrofits, commercial rooftops and new-build developments. Each case study sets out the brief, what we installed and how it performs." eyebrow="#OurWork" crumb="Our work" img="https://d8j0ntlcm91z4.cloudfront.net/user_3GEBhpJDThOL4J5Wt3PW565Nnud/hf_20260914_083236_17878cc6-17ea-4a5a-91f6-40261fcae547.png" alt="SK Energy installers fitting solar panels on a slate roof" chips="{{ heroChips }}" active-chip="{{ sector }}" size="short" hint-size="100%,620px"></dc-import>

  <section data-screen-label="Projects" style="padding:clamp(64px,8vw,110px) clamp(20px,4.6vw,66px);max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(28px,3vw,40px)">
    <div data-reveal="" style="display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center">
      <div role="tablist" aria-label="Filter projects by sector" style="display:flex;flex-wrap:wrap;gap:8px;padding:6px;border-radius:999px;background:#F1F1EF">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
          <button type="button" role="tab" aria-selected="{{ t.selected }}" onClick="{{ t.select }}" style="{{ t.style }}">{{ t.label }}</button>
        </sc-for>
      </div>
      <span aria-live="polite" style="font-size:15px;color:#6C7566">{{ countLabel }}</span>
    </div>
    <div ref="{{ gridRef }}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px">
      <sc-for list="{{ cases }}" as="c" hint-placeholder-count="0">
        <a href="{{ c.href }}" data-card="" data-hover-zoom="" style="position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(520px,44vw,600px);border-radius:clamp(28px,3vw,40px);overflow:hidden;background:#262B27;color:#fff" style-hover="color:#fff">
          <img data-zoom="" src="{{ c.img }}" alt="{{ c.alt }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
          <div style="position:absolute;inset:0;background:linear-gradient(0deg, rgba(14,17,16,0.92) 0%, rgba(14,17,16,0.4) 45%, rgba(14,17,16,0) 75%)"></div>
          <div style="position:absolute;top:22px;left:22px;right:22px;display:flex;justify-content:space-between;gap:8px">
            <div style="display:flex;gap:8px;flex-wrap:wrap"><span style="padding:4px 12px;border-radius:999px;background:#cbf24c;color:#0E1110;font-size:13px;font-weight:500">{{ c.type }}</span><span style="padding:3px 11px;border-radius:999px;background:rgba(14,17,16,0.35);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.3);font-size:13px">{{ c.location }}</span></div>
            <span aria-hidden="true" style="width:48px;height:48px;border-radius:50%;background:#fff;color:#0E1110;display:flex;align-items:center;justify-content:center;flex-shrink:0">→</span>
          </div>
          <div style="position:relative;padding:clamp(24px,2.6vw,36px);display:flex;flex-direction:column;gap:14px">
            <h2 style="margin:0;font-size:clamp(26px,2.4vw,34px);font-weight:600;letter-spacing:-0.02em;line-height:1.2">{{ c.title }}</h2>
            <p style="margin:0;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);max-width:520px">{{ c.summary }}</p>
            <dl style="margin:6px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid rgba(255,255,255,0.2);padding-top:16px">
              <sc-for list="{{ c.statList }}" as="st" hint-placeholder-count="3">
                <div><dt style="font-size:13px;color:rgba(255,255,255,0.65);margin-bottom:4px">{{ st.label }}</dt><dd style="margin:0;font-size:clamp(18px,1.6vw,24px);font-weight:600;color:#cbf24c">{{ st.value }}</dd></div>
              </sc-for>
            </dl>
          </div>
        </a>
      </sc-for>
    </div>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#6C7566">Photography shown is representative. Performance figures appear only where they have been measured.</p>
  </section>
</main>
<dc-import name="SiteFooter" hint-size="100%,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { d: null, sector: 'All' };
  gridRef = React.createRef();
  componentDidMount() {
    const q = new URLSearchParams(location.search).get('sector');
    if (q) this.setState({ sector: q });
    import(new URL('site-data.js', location.href).href).then(d => this.setState({ d }));
    import(new URL('site-motion.js', location.href).href).then(m => { this.motion = m; m.init(); });
  }
  componentDidUpdate() {
    const changed = this._sec !== undefined && this._sec !== this.state.sector;
    this._sec = this.state.sector;
    if (changed && this.motion && this.gridRef.current) this.motion.pop(this.gridRef.current.querySelectorAll('[data-card]'));
  }
  renderVals() {
    const d = this.state.d, sec = this.state.sector;
    const sectors = d ? d.SECTORS : ['All', 'Residential', 'Commercial', 'New build'];
    const all = d ? d.CASES : [];
    const list = sec === 'All' ? all : all.filter(c => c.sector === sec);
    const ez = 'cubic-bezier(.22,1,.36,1)';
    return {
      gridRef: this.gridRef, sector: sec,
      heroChips: sectors.map(s => ({ label: s === 'All' ? 'All projects' : s, href: 'Work.dc.html' + (s === 'All' ? '' : '?sector=' + encodeURIComponent(s)), key: s })),
      tabs: sectors.map(s => {
        const on = s === sec;
        return { label: s, selected: on, select: () => this.setState({ sector: s }),
          style: { height: 44, padding: '0 20px', borderRadius: 999, border: 0, cursor: 'pointer', fontSize: 15, fontWeight: on ? 600 : 500, background: on ? '#0E1110' : 'transparent', color: on ? '#fff' : '#0E1110', transition: 'background .35s ' + ez + ', color .35s' } };
      }),
      countLabel: d ? list.length + (list.length === 1 ? ' project' : ' projects') : '',
      cases: list.map(c => ({ ...c, href: d.LINKS.caseStudy(c.slug), statList: c.stats.map(([value, label]) => ({ value, label })) }))
    };
  }
}
</script>
</body>
</html>
